[package]
name = "pixelforge"
version = "0.6.0"
edition = "2021"
description = "A Vulkan-based video encoding library for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/hgaiser/pixelforge"
keywords = ["vulkan", "video", "encoding", "h264", "h265"]
categories = ["multimedia::video", "graphics"]
readme = "README.md"

[features]
default = []
dmabuf = []

[dependencies]
# Vendored: point at moonshine's vendored ash instead of fetching from git.
ash = { path = "../ash/ash", features = ["loaded"] }
thiserror = "1.0"
tracing = "0.1"

# Vendored into moonshine: [dev-dependencies] (env_logger, tracing-subscriber)
# removed — used only by pixelforge's own tests/examples, which leaked into
# moonshine's Cargo.lock once pixelforge became a path dependency.
