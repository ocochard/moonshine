[package]
name = "pixelforge"
version = "0.9.1"
edition = "2024"
description = "A Vulkan-based video encoding library for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/hgaiser/pixelforge"
keywords = ["vulkan", "video", "encoding", "h264", "h265"]
categories = ["multimedia::video", "graphics"]
readme = "README.md"
# Vendored into moonshine: the examples use the stripped [dev-dependencies],
# so keep them out of the workspace's build targets. Cargo's workspace
# `exclude` does not apply to path dependencies.
autoexamples = false

[features]
default = []
dmabuf = []

[dependencies]
# Vendored: point at moonshine's vendored ash instead of fetching from git.
ash = { path = "../ash/ash", features = ["loaded"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2.0"
tracing = "0.1"

# Vendored into moonshine: [dev-dependencies] (env_logger, pollster,
# tracing-subscriber) removed — used only by pixelforge's own tests/examples,
# which leaked into moonshine's Cargo.lock once pixelforge became a path
# dependency.
