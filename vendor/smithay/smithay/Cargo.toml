[package]
name = "smithay"
version = "0.7.0"
authors = ["Victor Berger <victor.berger@m4x.org>", "Drakulix (Victoria Brekenfeld)"]
license = "MIT"
description = "Smithay is a library for writing wayland compositors."
repository = "https://github.com/Smithay/smithay"
edition = "2024"
readme = "README.md"
homepage = "https://smithay.github.io/"
keywords = ["wayland", "compositor", "graphics", "server"]
categories = ["gui"]
rust-version = "1.85"

[package.metadata.docs.rs]
features = ["test_all_features", "libseat/docs_rs"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Vendored into moonshine and pruned: only the optional deps reachable from
# moonshine-core's requested smithay feature set are kept. The backends
# moonshine does not use (winit, x11 windowing, libinput, udev, libseat,
# pixman/glow renderers, vulkan, tracy) are dropped along with their
# optional deps so Cargo.lock stays free of ~110 never-compiled crates
# (winit/sdl2/glow/udev/... — Cargo records the full optional-dep union for
# a path dependency, unlike a git dependency).
appendlist = "1.4"
bitflags = "2.2.1"
calloop = "0.14.0"
cursor-icon = "1.2.0"
cgmath = "0.18.0"
downcast-rs = "1.2.0"
drm-fourcc = "^2.2.0"
drm = { version = "0.14.0", optional = true }
drm-ffi = { version = "0.9.0", optional = true }
errno = "0.3.5"
gbm = { version = "0.18.0", optional = true, default-features = false, features = ["drm-support"] }
indexmap = "2.11"
libc = "0.2.103"
libloading = { version="0.8.0", optional = true }
rustix = { version = "1.0.7", features = ["event", "fs", "mm", "net", "pipe", "process", "shm", "time"] }
rand = "0.9.0"
scopeguard = { version = "1.1.0", optional = true }
tracing = "0.1.37"
tempfile = { version = "3.0", optional = true }
thiserror = "2.0.12"
wayland-protocols = { version = "0.32.12", features = ["unstable", "staging", "server"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"], optional = true }
wayland-protocols-misc = { version = "0.3.12", features = ["server"], optional = true }
wayland-server = { version = "0.31.13", optional = true }
wayland-sys = { version = "0.31.11", optional = true }
wayland-backend = { version = "0.3.15", optional = true }
x11rb = { version = "0.13.0", optional = true, features = ["res", "sync"]}
xkbcommon = { version = "0.9.0", features = ["wayland"]}
encoding_rs = { version = "0.8.33", optional = true }
profiling = "1.0.13"
smallvec = "1.11"
atomic_float = "1.1.0"
sha2 = "0.10.9"

# Vendored into moonshine: [dev-dependencies] (clap, criterion, image,
# tracing-subscriber) removed — only used by smithay's own examples/benches,
# which are dropped below. Keeps them out of moonshine's crate graph.

[build-dependencies]
gl_generator = { version = "0.14", optional = true }
pkg-config = { version = "0.3.17", optional = true }
cc = { version = "1.0.79", optional = true }

# Vendored into moonshine and pruned: the winit/x11-windowing/libinput/udev/
# libseat/pixman/glow/vulkan/tracy backends and their features are removed —
# moonshine only drives smithay headless (DRM/GBM/EGL/GL + Wayland frontend +
# XWayland). `default` is narrowed to what moonshine-core requests.
[features]
default = ["backend_drm", "backend_gbm", "desktop", "renderer_gl", "xwayland", "wayland_frontend"]
backend_drm = ["drm", "drm-ffi"]
backend_gbm = ["gbm", "cc", "pkg-config", "backend_drm"]
backend_gbm_has_fd_for_plane = []
backend_gbm_has_create_with_modifiers2 = []
backend_egl = ["gl_generator", "libloading"]
backend_session = []
desktop = []
renderer_gl = ["gl_generator", "backend_egl"]
renderer_test = []
use_system_lib = ["wayland_frontend", "wayland-backend/server_system", "wayland-sys", "gbm?/import-wayland"]
wayland_frontend = ["wayland-server", "wayland-protocols", "wayland-protocols-wlr", "wayland-protocols-misc", "tempfile"]
x11rb_event_source = ["x11rb"]
xwayland = ["encoding_rs", "wayland_frontend", "x11rb/composite", "x11rb/xfixes", "x11rb/randr", "x11rb_event_source", "scopeguard"]

# Vendored into moonshine: [[example]], [[bench]] and [profile.*] blocks
# removed. The example/bench sources are dropped and profiles on a non-root
# package are ignored by Cargo anyway.
