# Vendored git dependency of moonshine (fork hgaiser/smithay, branch
# master-moonshine @ fd6e04e). This outer workspace root exists only so the
# smithay crate lives in a subdirectory (smithay/smithay), mirroring the ash
# layout: moonshine reaches the crate via `path = "../vendor/smithay/smithay"`
# while this directory is listed in moonshine's workspace `exclude`, keeping
# smithay's build graph fully separate from moonshine's.
[workspace]
resolver = "3"
members = ["smithay"]
