[workspace]
members = [".", "moonshine-core", "moonshine-tools", "moonshine-wsi"]
# Vendored git deps live under vendor/. Those that carry their own
# [workspace] root (ash, smithay, inputtino) are excluded so Cargo reaches
# them as independent workspaces via path dependency instead of trying to
# absorb them as members of ours.
exclude = [
    "vendor/ash",
    "vendor/smithay",
    "vendor/inputtino",
]
resolver = "2"

# tokio-enet binds the control stream IPv6-only on a wildcard IPv6 address,
# dropping IPv4 clients under FreeBSD's default net.inet6.ip6.v6only=1. Control
# carries the session keepalive, so the whole session dies 60s in. Patched in
# vendor/ until the fix lands upstream (hgaiser/tokio-enet).
[patch.crates-io]
tokio-enet = { path = "vendor/tokio-enet" }

[workspace.package]
version = "0.16.0"

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
moonshine-core = { path = "moonshine-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.18.0"
