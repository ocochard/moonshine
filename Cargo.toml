[workspace]
members = [".", "moonshine-core", "moonshine-tools", "moonshine-wsi"]
resolver = "2"

[workspace.package]
version = "0.15.0"

# FreeBSD support in upstream socket-pktinfo (0.3.x/0.4.x) is missing —
# the crate references Linux-only IP_PKTINFO / struct in_pktinfo. We
# maintain a local fork on the `freebsd` branch until the upstream PR
# lands. The override is transparent on Linux.
[patch.crates-io]
socket-pktinfo = { path = "vendor/socket-pktinfo" }

[package]
name = "moonshine"
version.workspace = true
edition = "2024"

[dependencies]
async-shutdown = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
moonshine-core = { path = "moonshine-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "5.18.0"
